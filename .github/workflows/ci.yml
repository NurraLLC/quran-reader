name: CI

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why hosted Linux/container verification is needed for this reviewed ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quran-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The corpus is not in the repository: fetch it (hash-verified) once per source pin, then reuse.
      - uses: actions/cache@v4
        id: corpus
        with:
          path: |
            data/raw
            data/processed
          key: corpus-${{ hashFiles('corpus/sources.json', 'scripts/fetch-corpus.ts', 'scripts/import-corpus.ts', 'scripts/import-wbw.ts') }}
      - if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          npm run corpus:fetch
          npm run corpus:import -- --manifest corpus/sources.json
          npm run wbw:import
      - run: npm run corpus:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t quran-reader:check .
      - name: Validate the production proxy configuration
        run: docker run --rm -e QO_DOMAIN=reader-origin.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Start, fund, and read back the hosted pool
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name reader-check -p 127.0.0.1:4317:4317 -e QO_BASE_PATH=/quran-reader quran-reader:check
          trap 'docker logs reader-check; docker rm -f reader-check' EXIT
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:4317/healthz
          docker exec reader-check npx tsx scripts/sponsor-pool.ts 1 ci-check
          curl --fail -c /tmp/reader-cookie http://127.0.0.1:4317/quran-reader/api/me
          curl --fail -b /tmp/reader-cookie http://127.0.0.1:4317/quran-reader/api/pool | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["left"] == 3600, p'
