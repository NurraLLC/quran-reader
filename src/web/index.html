<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1418" />
    <meta name="referrer" content="no-referrer" />
    <title>Quran Reader</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Recite, and the page follows along. Each word you recite lights up with its meaning, in Arabic and English, on your phone or your stream. Free for everyone, through sadaqah." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quran Reader by Nurra: recite, and the page follows along" />
    <meta property="og:description" content="The ayah you recite appears as you recite it, each word with its meaning. Free on your phone and as an OBS overlay." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Al-Fatihah 1:2 with its first word highlighted and its meaning, All praises and thanks, underneath" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/UthmanicHafs_V22.ttf" as="font" type="font/ttf" crossorigin />
    <!-- In the page (not the stylesheet) so the server can serve it under a base path. -->
    <style>
      @font-face { font-family: 'Uthmanic Hafs'; src: url('/fonts/UthmanicHafs_V22.ttf') format('truetype'); font-display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- qo:summary (the server puts each page's static summary here, for readers without the app) -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
